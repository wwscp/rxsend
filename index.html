    { src: 'https://aka.doubaocdn.com/s/wQLpLQ73jB', name: 'Mope (海) — God-Pineapple' },
    { src: 'https://aka.doubaocdn.com/s/o1hR3j44rc', name: '反叛之师 — 西蒙Leonardo' },
    { src: 'https://aka.doubaocdn.com/s/6sj6mhVbuK', name: '终日 Legacy — 浦栗子SpuChestnut' },
    { src: 'https://aka.doubaocdn.com/s/SuRwFrY1Cw', name: 'UY Scuti (Chill Mix) — Mekkhala WANG' },
    { src: 'https://aka.doubaocdn.com/s/EdUZ3KT3Nb', name: 'Habits — Mr.Kitty / PASTEL GHOST' },
    { src: 'https://aka.doubaocdn.com/s/nd44whvH0U', name: 'Give Up The Fantasy — EREAL' },
    { src: 'https://aka.doubaocdn.com/s/en48f1hN4d', name: 'Небо — SadSvit' }
  ];

  const bgm = document.getElementById('bgm');
  const trackName = document.getElementById('trackName');
  bgm.volume = 0.45;

  let current = -1;
  let unlocked = false;
  let nextBlobUrl = null;
  let nextIdx = -1;

  function pickRandom(exclude) {
    if (tracks.length === 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * tracks.length); } while (i === exclude);
    return i;
  }
  function loadTrack(idx, srcUrl) {
    current = idx;
    bgm.src = srcUrl || tracks[idx].src;
    trackName.textContent = tracks[idx].name;
  }
  // 后台预下载下一首，转成 Blob URL，切歌时本地播放零等待
  function preloadNext() {
    if (nextBlobUrl) { URL.revokeObjectURL(nextBlobUrl); nextBlobUrl = null; }
    nextIdx = pickRandom(current);
    fetch(tracks[nextIdx].src)
      .then(r => r.blob())
      .then(b => { nextBlobUrl = URL.createObjectURL(b); })
      .catch(() => { nextBlobUrl = null; });
  }
  // 标准解锁路径：先 muted 起播，拿到媒体激活后再取消静音
  function unlockAudio() {
    if (unlocked) return;
    bgm.muted = true;
    bgm.play().then(() => {
      bgm.muted = false;
      bgm.play().then(() => { unlocked = true; }).catch(() => {});
    }).catch(() => {});
  }

  // 首次随机选曲
  loadTrack(pickRandom(-1));
  preloadNext();

  bgm.addEventListener('canplaythrough', unlockAudio);
  bgm.addEventListener('loadeddata', unlockAudio);
  window.addEventListener('load', unlockAudio);
  [300, 1000, 2500, 5000].forEach(t => setTimeout(unlockAudio, t));

  // 切歌：优先用预下载好的 Blob，避免网络卡顿
  bgm.addEventListener('ended', () => {
    if (nextBlobUrl) {
      loadTrack(nextIdx, nextBlobUrl);
      nextBlobUrl = null;
    } else {
      loadTrack(pickRandom(current));
    }
    bgm.muted = false;
    bgm.play().catch(() => {});
    preloadNext();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) unlockAudio();
  });

  // 兜底：任何交互强制解锁
  ['click', 'keydown', 'mousemove', 'touchstart', 'wheel'].forEach(evt => {
    window.addEventListener(evt, () => {
      unlocked = false;
      unlockAudio();
    }, { passive: true });
  });
</script>
</body>
</html>
